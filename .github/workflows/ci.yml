name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: ruff check app/ && ruff format --check app/

      - name: Run tests
        working-directory: backend
        env:
          # Use a dummy Groq key so config loads without error
          # Tests that need a real key are marked with pytest.mark.integration
          GROQ_API_KEY: test-key-for-ci
          SECRET_KEY: test-secret-for-ci
          DATABASE_URL: sqlite:///./test.db
          LANGSMITH_TRACING: "false"
        run: pytest tests/ -v -m "not integration" --cov=app

  test-frontend:
    name: Frontend — build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build